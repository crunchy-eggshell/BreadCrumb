prefix: "<b><gradient:#8c592d:#b38940:#8c592d>BreadCrumb </gradient><color:#777578>» </color></b>"

general:
  no-permission: "<u><color:#bf1711>You don't have permission to run that command!</color></u>"
  players-only: "<u><color:#bf1711>This command is for players only!</color></u>"
  reload-success: "<u><color:#35bf28>Config reloaded!</color></u>"
  reload-failed: "<u><color:#bf1711>Config reload failed, old settings are still active, please check the console for errors!</color></u>"

selection:
  wand-given: "<color:#35bf28>Wand given successfully! Left-click to set Pos1, right-click to set Pos2!</color>"
  pos1-set: "<color:#35bf28>Pos1 set, <x>, <y>, <z>!</color>"
  pos2-set: "<color:#35bf28>Pos2 set, <x>, <y>, <z>!</color>"
  incomplete: "<color:#bf1711>Both positions need to be set before running any related commands!</color>"
  different-worlds: "<color:#bf1711>Pos1 is in a different world than Pos2, please set them in the same world to continue!</color>"

structure:
  saved: "<color:#35bf28>Structure saved with name: <name>, and size: <size>!</color>"
  already-exists: "<color:#bf1711>A structure with that name already exists, please choose a different one, or delete the current one!</color>"
  invalid-name: "<color:#bf1711>Invalid name (Allowed characters: letters, numbers, dashes, and underscores)!</color>"
  not-found: "<color:#bf1711>No structure has the name: <name>!</color>"
  deleted: "<color:#35bf28>Structure successfully deleted <name>!</color>"
  list-header: "<b><u><aqua>Structure list below, <count> structures saved:</aqua></u></b>"
  list-entry: "<yellow><name> : <size> : <description></yellow>"
  list-empty: "<color:#bf1711>There are no structures to list!</color>"
  save-failed: "<b><u><color:#bf1711>The structure couldn't save, please check the console for errors!</color></u></b>"
  delete-failed: "<b><u><color:#bf1711>The structure couldn't delete, please check the console for errors!</color></u></b>"

spawn:
  started: "<color:#35bf28>Structure spawning started: Spawning <amount> of <structure> within <radius>!</color>"
  report: "<aqua>Placed <placed> / <amount> of <drop>!</aqua>"
  sub-failed: "<color:#bf1711><sub> couldn't find viable terrain to spawn on!</color>"
  none-placed: "<color:#bf1711>No subs of <drop> have been placed, please have a bigger radius, or higher flatness tolerance!</color>"

drop:
  list-header: "<b><u><aqua>Active drops list below, <count> drops active:</aqua></u></b>"
  list-entry: "<yellow><drop> : <structure> : <subs> : <timer></yellow>"
  list-empty: "<color:#bf1711>There are no active drops to list!</color>"
  not-found: "<color:#bf1711>No drop or sub has the name: <name>!</color>"
  teleported: "<color:#35bf28>Successfully teleported to <sub>!</color>"
  removed: "<color:#35bf28>Removed drop <drop> (<subs> subs)!</color>"
  sub-removed: "<color:#35bf28><sub> of <drop> has been removed!</color>"
  expired: "<b><u><aqua>Drop <drop> has expired and been removed!</aqua></u></b>"
  subs-header: "<aqua><u><b><drop> subs list below, <subs> subs available:</b></u></aqua>"
  subs-entry: "<yellow><sub> : <x>, <y>, <z></yellow>"
